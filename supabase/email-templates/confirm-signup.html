<!--
Supabase Dashboard > Authentication > Email Templates > Confirm signup
Replace the confirmation link with the token-hash URL below.
Do not use {{ .ConfirmationURL }} here: that flow exchanges a PKCE code and
requires the browser that initiated signup to retain its verifier.
-->
<h2>Confirm your Protlys Hub account</h2>
<p>Thanks for joining Protlys Hub. Confirm your email address to activate your account.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/hub">Confirm my email</a></p>
<p>If you did not create a Protlys Hub account, you can ignore this email.</p>
