<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F8F6">
  <title>Protlys Hub</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;background:#F7F8F6;color:#111;font-family:Arial, sans-serif}
    main{width:min(100%,520px);margin:0 auto;padding:24px 20px 40px}
    header{height:64px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #e5e8e2}
    header img{width:116px;height:auto;object-fit:contain}
    section{padding:34px 0 20px}
    .eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#4F9F35}
    h1{font-size:24px;line-height:1.2;margin:8px 0}
    p{font-size:14px;line-height:1.55;color:#62685f;margin:0}
    .status{display:inline-flex;align-items:center;gap:7px;margin-top:18px;padding:8px 11px;border:1px solid #dce6d6;border-radius:999px;background:#fff;font-size:12px;font-weight:700;color:#416f31}
    .dot{width:7px;height:7px;border-radius:50%;background:#6BCB45}
    a{display:inline-flex;margin-top:22px;padding:11px 18px;border-radius:999px;background:#6BCB45;color:#111;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <header><img src="/protlys-logo-exact.png" alt="Protlys"></header>
    <section>
      <div class="eyebrow">Protlys Hub</div>
      <h1>Your space for movement and progress.</h1>
      <p>You're offline right now. Reconnect to refresh your feed and dashboard. Previously opened pages may still be available on this device.</p>
      <div class="status"><span class="dot"></span> Offline · saved data stays on this device</div>
      <div><a href="/feed">Open Hub</a></div>
    </section>
  </main>
</body>
</html>
