<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F8F6">
  <title>Protlys Hub — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F7F8F6;color:#111;font-family:system-ui,sans-serif}
    main{width:min(100%,380px);text-align:center;background:#fff;border:1px solid #e5e8e2;border-radius:20px;padding:30px 22px}
    img{width:64px;height:64px;object-fit:contain;margin-bottom:12px}
    h1{font-size:22px;margin:0 0 8px}p{font-size:14px;line-height:1.55;color:#62685f;margin:0 0 20px}
    a{display:inline-flex;padding:11px 18px;border-radius:999px;background:#6BCB45;color:#111;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <img src="/protlys-logo-exact.png" alt="Protlys">
    <h1>You're offline</h1>
    <p>Reconnect to the internet and try again. Your Protlys Hub account and data have not been changed.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
