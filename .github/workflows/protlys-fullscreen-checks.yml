name: Protlys Hub checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - run: npm --version
      - run: npm ci
      - run: npm test
      - run: npm run build
